<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDP Document Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-y: auto;
    }

    #timer {
      width: 100%;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      color: #00ff9d;
      padding: 10px 0;
      background: rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.2);
      position: sticky;
      top: 0;
      z-index: 999;
      backdrop-filter: blur(6px);
    }

    img {
      width: 100%;
      max-width: 850px;
      margin: 8px auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255,255,255,0.1);
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.4rem;
      text-align: center;
      z-index: 9999;
      padding: 20px;
    }

    #overlay.show {
      display: flex;
      animation: fadein 0.6s ease-in-out;
    }

    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="timer"></div>
  <div id="viewer"></div>

  <div id="overlay">
    <div>
      ⏳ Access time expired!<br><br>
      Please contact the document owner for extended viewing.
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const overlay = document.getElementById('overlay');
    const timer = document.getElementById('timer');
    const totalPages = 21;
    const DURATION = 25000; //  seconds

    let expiry = localStorage.getItem('expiryTime');
    const now = Date.now();

    if (!expiry) {
      expiry = now + DURATION;
      localStorage.setItem('expiryTime', expiry);
    }

    expiry = parseInt(expiry);

    if (now >= expiry) {
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
      timer.style.display = 'none';
    } else {
      // Load PDF images
      for (let i = 1; i <= totalPages; i++) {
        const img = document.createElement('img');
        img.src = `web/EDP__________ conv ${i}.jpeg`;
        img.alt = `Page ${i}`;
        viewer.appendChild(img);
      }

      const interval = setInterval(() => {
        const remaining = expiry - Date.now();
        if (remaining <= 0) {
          clearInterval(interval);
          timer.textContent = "";
          overlay.classList.add('show');
          document.body.style.overflow = 'hidden';
        } else {
          timer.textContent = `⏳ Time left: ${(remaining / 1000).toFixed(1)} seconds`;
        }
      }, 100);

      setTimeout(() => {
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
        timer.style.display = 'none';
      }, expiry - now);
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || ['p', 's', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'PrintScreen') overlay.classList.add('show');
    });
  </script>
</body>
</html>
