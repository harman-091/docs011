<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure PDF Viewer</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #111;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 1.5rem;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 999;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <iframe src="EDP__________.pdf#toolbar=0&navpanes=0&scrollbar=0"></iframe>

  <div class="overlay" id="overlay">
    <p>⏳ Access expired!<br>Document closed after 40 seconds.</p>
  </div>

  <script>
    // Disable keyboard shortcuts (Ctrl+S, Print, etc.)
    document.onkeydown = function(e) {
      if (e.ctrlKey && (e.key === 's' || e.key === 'p' || e.key === 'u' || e.key === 'Shift')) {
        e.preventDefault();
        return false;
      }
    };

    // Timer for 40 seconds
    setTimeout(() => {
      document.querySelector("iframe").style.display = "none";
      document.getElementById("overlay").style.display = "flex";
    }, 40000);
  </script>
</body>
</html>
